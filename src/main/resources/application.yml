spring:
  application:
    name: partnerguard-api
  datasource:
    # The application connects as a non-owner role (ADR-0015).
    url: ${DB_URL:jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/partnerguard}
    username: ${APP_DB_USER:partnerguard_app}
    password: ${APP_DB_PASSWORD:}
  flyway:
    # Migrations run as the schema owner, with their own credentials.
    url: ${DB_URL:jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/partnerguard}
    user: ${POSTGRES_USER:partnerguard}
    password: ${POSTGRES_PASSWORD:}
    locations: classpath:db/migration
    placeholders:
      appDbUser: ${APP_DB_USER:partnerguard_app}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  security:
    oauth2:
      resourceserver:
        jwt:
          # Keycloak realm (ADR-0002). Discovery and JWKS are fetched on the first token, not at startup.
          issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:8180/realms/partnerguard}
          # Tokens issued for other clients of the realm lack this audience and get a 401.
          audiences: partnerguard-api
  mvc:
    problemdetails:
      enabled: true
  jackson:
    deserialization:
      # Unknown JSON properties are a 400, so nothing like partnerId can be smuggled in (ADR-0003).
      fail-on-unknown-properties: true
  web:
    error:
      # Spring Boot 4 name; the old server.error.* keys are no longer bound.
      include-stacktrace: never
      include-message: never
      include-binding-errors: never
      include-exception: false
      # No HTML error page: errors must be Problem Details (ADR-0008).
      whitelabel:
        enabled: false

springdoc:
  # API docs and Swagger UI are enabled only in the local profile (ADR-0005, DOC-02).
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
  # Document exactly what the contract declares; no codes inferred from the controller advice.
  override-with-generic-response: false

partnerguard:
  # Requests per minute (specs/rate-limiting.md, ADR-0006). Tests use small values.
  rate-limit:
    ip-ceiling-per-minute: 120
    user-per-minute: 60
    user-writes-per-minute: 20
    anonymous-per-minute: 60

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      # Kubernetes probes are out of scope; keeps the body to {"status":"UP"} (AUTHZ-14).
      probes:
        enabled: false
