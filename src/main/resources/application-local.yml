# Local development only. Activated by ./mvnw spring-boot:run (see pom.xml), never by a packaged jar.
# Password defaults match docker-compose.yml and are not secrets.
spring:
  config:
    # Picks up overrides from the same .env file docker compose reads.
    import: optional:file:.env[.properties]
  datasource:
    password: ${APP_DB_PASSWORD:partnerguard-app-local}
  flyway:
    password: ${POSTGRES_PASSWORD:partnerguard-local}
    # Seed data (specs/fixtures.md) is loaded only in this profile (ADR-0015).
    locations: classpath:db/migration,classpath:db/seed
  web:
    resources:
      # Serves contracts/openapi.yaml at /openapi.yaml for Swagger UI (ADR-0024). Read from the
      # repository at runtime, never packaged; spring-boot:run starts in the repository root.
      static-locations: classpath:/static/,file:contracts/

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    # Swagger UI renders the contract itself; /v3/api-docs stays generated, for DOC-01 (ADR-0024).
    url: /openapi.yaml
