openapi: 3.0.3
info:
  title: PartnerGuard API
  version: 1.0.0
  description: |
    Secure REST API for managing insurance policies and partner repair shops.

    **This file is the source of truth for the HTTP contract** (see ADR-0007).
    Controllers implement interfaces generated from it; never change the API
    in code without changing this file first.

    ### Authentication
    Every operation requires a Keycloak-issued JWT access token
    (`Authorization: Bearer <token>`), except `GET /actuator/health`, which is
    served by Spring Boot Actuator and intentionally left out of this contract.

    ### Authorization
    Each operation declares the roles allowed to call it in `x-required-roles`.
    Calls from other roles get `403`. For `PARTNER` users, resources that belong
    to another partner are reported as `404`, exactly like resources that do not
    exist (see ADR-0004).
    A `PARTNER` caller gets `403` on every operation when its token lacks a valid
    `partner_id`, also carries an internal role, or names a partner that is
    `SUSPENDED` or does not exist (ADR-0003, ADR-0021).

    ### Errors
    Every error response uses `application/problem+json` (RFC 7807, ADR-0008).

    ### Rate limiting
    Exceeding a limit returns `429` with a `Retry-After` header in whole
    seconds (ADR-0006, ADR-0022). Before the token is validated, every request
    counts against a per-IP ceiling (120/min). After validation, each user
    (the token's verified `sub`) gets 60 requests/min, of which at most 20/min
    may be writes (`POST`, `PUT`, `PATCH`, `DELETE`); requests without a token
    get 60/min per IP. All limits are configurable.
  contact:
    name: PartnerGuard maintainers
  license:
    name: MIT

servers:
  - url: http://localhost:8080
    description: Local development

security:
  - bearerAuth: []

tags:
  - name: partners
    description: Partner repair shops
  - name: contracts
    description: Contracts between the insurer and a partner
  - name: claims
    description: Claims assigned to partners
  - name: policies
    description: Insurance policies

paths:
  /api/v1/partners:
    get:
      tags: [partners]
      operationId: listPartners
      summary: List partners
      x-required-roles: [ADMIN, ANALYST]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/PartnerSort'
      responses:
        '200':
          description: A page of partners. `taxId` is always masked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerPage'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [partners]
      operationId: createPartner
      summary: Create a partner
      description: Write operation. Recorded in the audit log and subject to the write rate limit.
      x-required-roles: [ADMIN]
      x-write-operation: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartnerCreateRequest'
      responses:
        '201':
          description: Partner created.
          headers:
            Location:
              description: URI of the new partner.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Partner'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/partners/me:
    get:
      tags: [partners]
      operationId: getCurrentPartner
      summary: Current partner's profile
      description: |
        Resolved from the `partner_id` claim of the token, never from the request.
        A `PARTNER` token without a valid `partner_id` claim gets `403`, and so does
        one whose partner is `SUSPENDED` or does not exist.
      x-required-roles: [PARTNER]
      responses:
        '200':
          description: The caller's partner profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Partner'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/contracts:
    get:
      tags: [contracts]
      operationId: listContracts
      summary: List contracts
      description: Internal roles see every contract; `PARTNER` users see only their own.
      x-required-roles: [ADMIN, ANALYST, PARTNER]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/ContractSort'
      responses:
        '200':
          description: A page of contracts visible to the caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractPage'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/contracts/{id}:
    get:
      tags: [contracts]
      operationId: getContract
      summary: Contract details
      description: Ownership enforced. A `PARTNER` asking for another partner's contract gets `404`.
      x-required-roles: [ADMIN, ANALYST, PARTNER]
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: The contract.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contract'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/claims:
    get:
      tags: [claims]
      operationId: listClaims
      summary: List claims
      description: Internal roles see every claim; `PARTNER` users see only their own.
      x-required-roles: [ADMIN, ANALYST, PARTNER]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/ClaimSort'
        - name: status
          in: query
          required: false
          description: Filter by claim status.
          schema:
            $ref: '#/components/schemas/ClaimStatus'
      responses:
        '200':
          description: A page of claims visible to the caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimPage'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/claims/{id}:
    get:
      tags: [claims]
      operationId: getClaim
      summary: Claim details
      description: Ownership enforced. A `PARTNER` asking for another partner's claim gets `404`.
      x-required-roles: [ADMIN, ANALYST, PARTNER]
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: The claim.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Claim'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
    patch:
      tags: [claims]
      operationId: updateClaim
      summary: Update a claim
      description: |
        Partial update. Absent fields are left unchanged; `null` values are rejected.
        Field-level permissions (ADR-0009):

        | Role    | status | description | amount | Extra condition |
        |---------|--------|-------------|--------|-----------------|
        | ADMIN   | yes    | yes         | yes    | Status transitions must be valid |
        | ANALYST | yes    | no          | no     | Status transitions must be valid |
        | PARTNER | no     | yes         | yes    | Own claims only, and only while `SUBMITTED` |

        Checks run in this order: body validation (`400`) → field permission (`403`)
        → ownership (`404`) → state rules (`409`).

        Write operation. Recorded in the audit log and subject to the write rate limit.
      x-required-roles: [ADMIN, ANALYST, PARTNER]
      x-write-operation: true
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimUpdateRequest'
      responses:
        '200':
          description: The updated claim.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Claim'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  /api/v1/policies/{number}:
    get:
      tags: [policies]
      operationId: getPolicyByNumber
      summary: Find a policy by its number
      x-required-roles: [ADMIN, ANALYST]
      parameters:
        - name: number
          in: path
          required: true
          description: Policy number, e.g. `POL-2026-000001`.
          schema:
            $ref: '#/components/schemas/PolicyNumber'
      responses:
        '200':
          description: The policy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Policy'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Access token issued by Keycloak realm `partnerguard`
        (issuer `http://localhost:8180/realms/partnerguard`, audience `partnerguard-api`).
        Locally, get one with `scripts/get-token.sh <user>` or `scripts/get-token.ps1 -User <user>`.

  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      description: Resource identifier (UUID).
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      required: false
      description: Zero-based page index.
      schema:
        type: integer
        format: int32
        minimum: 0
        maximum: 10000
        default: 0
    Size:
      name: size
      in: query
      required: false
      description: Page size.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 20
    PartnerSort:
      name: sort
      in: query
      required: false
      description: Sort order. Only the listed values are accepted.
      schema:
        type: string
        enum: ['legalName,asc', 'legalName,desc']
        default: 'legalName,asc'
    ContractSort:
      name: sort
      in: query
      required: false
      description: Sort order. Only the listed values are accepted.
      schema:
        type: string
        enum: ['startDate,asc', 'startDate,desc', 'endDate,asc', 'endDate,desc']
        default: 'startDate,desc'
    ClaimSort:
      name: sort
      in: query
      required: false
      description: Sort order. Only the listed values are accepted.
      schema:
        type: string
        enum: ['status,asc', 'status,desc', 'amount,asc', 'amount,desc']
        default: 'status,asc'

  headers:
    RetryAfter:
      description: Seconds to wait before retrying.
      schema:
        type: integer
        minimum: 1
    WwwAuthenticate:
      description: Bearer challenge, e.g. `Bearer error="invalid_token"`.
      schema:
        type: string

  responses:
    BadRequest:
      description: The request is malformed or fails validation.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblem'
    Unauthorized:
      description: Missing, invalid or expired token.
      headers:
        WWW-Authenticate:
          $ref: '#/components/headers/WwwAuthenticate'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: The caller's role may not perform this operation or change these fields, or the caller is a misconfigured, suspended or unknown partner.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: The resource does not exist or belongs to another partner. The two cases are indistinguishable.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: The request conflicts with the resource's current state (duplicate tax ID, invalid status transition, claim no longer editable).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnsupportedMediaType:
      description: The request body is not `application/json`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Rate limit exceeded.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalError:
      description: Unexpected error. The body never contains stack traces, SQL or class names.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    Problem:
      type: object
      description: RFC 7807 Problem Details.
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
          description: Problem type URI. See `specs/errors.md` for the catalog.
          example: https://problems.partnerguard.example/not-found
        title:
          type: string
          example: Resource not found
        status:
          type: integer
          format: int32
          example: 404
        detail:
          type: string
          description: Human-readable explanation. Never contains internal details.
          example: The requested resource was not found.
        instance:
          type: string
          format: uri-reference
          example: /api/v1/claims/40000000-0000-4000-8000-00000000b001

    ValidationProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            errors:
              type: array
              items:
                $ref: '#/components/schemas/FieldError'

    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
          example: taxId
        message:
          type: string
          example: must be a valid CNPJ

    PageMetadata:
      type: object
      required: [page, size, totalElements, totalPages]
      properties:
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32

    PlainText:
      type: string
      description: |
        Plain text only. Characters `<` and `>` and control characters other than
        tab, line feed and carriage return are rejected (ADR-0013).
      pattern: '^[^<>\x00-\x08\x0B\x0C\x0E-\x1F\x7F]*$'

    PartnerStatus:
      type: string
      enum: [ACTIVE, SUSPENDED]

    Partner:
      type: object
      required: [id, legalName, taxId, status]
      properties:
        id:
          type: string
          format: uuid
          example: 10000000-0000-4000-8000-00000000000a
        legalName:
          type: string
          example: Oficina Alfa Ltda
        taxId:
          type: string
          description: Masked CNPJ. Only the two check digits are visible (ADR-0010).
          pattern: '^\*\*\.\*\*\*\.\*\*\*/\*\*\*\*-[0-9]{2}$'
          example: '**.***.***/****-81'
        status:
          $ref: '#/components/schemas/PartnerStatus'

    PartnerCreateRequest:
      type: object
      additionalProperties: false
      required: [legalName, taxId]
      properties:
        legalName:
          type: string
          description: Plain text (same rule as the `PlainText` schema).
          pattern: '^[^<>\x00-\x08\x0B\x0C\x0E-\x1F\x7F]*$'
          minLength: 3
          maxLength: 200
          example: Oficina Gama Ltda
        taxId:
          type: string
          description: |
            CNPJ, numeric or alphanumeric, with or without punctuation. Check digits
            are validated. Stored normalized (14 characters, uppercase, no punctuation).
          pattern: '^([0-9A-Za-z]{2}\.?[0-9A-Za-z]{3}\.?[0-9A-Za-z]{3}/?[0-9A-Za-z]{4}-?[0-9]{2})$'
          example: 12.ABC.345/01DE-35

    PartnerPage:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          required: [content]
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/Partner'

    Contract:
      type: object
      required: [id, partnerId, startDate, endDate, terms]
      properties:
        id:
          type: string
          format: uuid
        partnerId:
          type: string
          format: uuid
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        terms:
          type: string

    ContractPage:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          required: [content]
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/Contract'

    ClaimStatus:
      type: string
      description: |
        Allowed transitions: `SUBMITTED → UNDER_REVIEW`, `UNDER_REVIEW → APPROVED`,
        `UNDER_REVIEW → REJECTED`. `APPROVED` and `REJECTED` are final.
      enum: [SUBMITTED, UNDER_REVIEW, APPROVED, REJECTED]

    Money:
      type: number
      description: Amount in BRL, at most two decimal places.
      minimum: 0.01
      maximum: 1000000.00
      multipleOf: 0.01
      example: 1250.50

    Claim:
      type: object
      required: [id, policyId, partnerId, description, status, amount]
      properties:
        id:
          type: string
          format: uuid
        policyId:
          type: string
          format: uuid
        partnerId:
          type: string
          format: uuid
        description:
          type: string
        status:
          $ref: '#/components/schemas/ClaimStatus'
        amount:
          $ref: '#/components/schemas/Money'

    ClaimUpdateRequest:
      type: object
      description: At least one field is required. Unknown fields (e.g. `partnerId`) are rejected with `400`.
      additionalProperties: false
      minProperties: 1
      properties:
        status:
          $ref: '#/components/schemas/ClaimStatus'
        description:
          type: string
          description: Plain text (same rule as the `PlainText` schema).
          pattern: '^[^<>\x00-\x08\x0B\x0C\x0E-\x1F\x7F]*$'
          minLength: 1
          maxLength: 2000
        amount:
          $ref: '#/components/schemas/Money'

    ClaimPage:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          required: [content]
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/Claim'

    PolicyNumber:
      type: string
      pattern: '^[A-Z0-9-]{6,30}$'
      example: POL-2026-000001

    PolicyStatus:
      type: string
      enum: [ACTIVE, CANCELLED, EXPIRED]

    Policy:
      type: object
      required: [id, policyNumber, holderName, vehiclePlate, status]
      properties:
        id:
          type: string
          format: uuid
        policyNumber:
          $ref: '#/components/schemas/PolicyNumber'
        holderName:
          type: string
          example: Maria Silva
        vehiclePlate:
          type: string
          description: Brazilian plate, old (`ABC1234`) or Mercosul (`ABC1D23`) format.
          pattern: '^[A-Z]{3}[0-9][A-Z0-9][0-9]{2}$'
          example: ABC1D23
        status:
          $ref: '#/components/schemas/PolicyStatus'
