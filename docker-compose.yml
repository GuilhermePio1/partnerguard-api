# Local development stack. Credentials below are local-only defaults; override them in .env.
name: partnerguard

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: partnerguard
      # Schema owner: used by Flyway only.
      POSTGRES_USER: ${POSTGRES_USER:-partnerguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-partnerguard-local}
      # Application role: not the schema owner (ADR-0015). Created by docker/postgres/init.
      APP_DB_USER: ${APP_DB_USER:-partnerguard_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-partnerguard-app-local}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d partnerguard"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Identity provider (ADR-0002). Dev mode with its own embedded store: the realm is
  # imported from keycloak/realm-export.json when the container is created, so
  # recreating the container resets users and keys. The issuer is derived from the
  # request URL (http://localhost:8180/realms/partnerguard); no hostname is pinned, so
  # Testcontainers can reuse the same realm file on a random port.
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start-dev", "--import-realm"]
    environment:
      # Temporary admin of the master realm (admin console only), not a PartnerGuard user.
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-keycloak-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-keycloak-local}
    ports:
      - "127.0.0.1:8180:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro

volumes:
  postgres-data:
