# Local development stack. Credentials below are local-only defaults; override them in .env.
# Keycloak joins in milestone 3.
name: partnerguard

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: partnerguard
      # Schema owner: used by Flyway only.
      POSTGRES_USER: ${POSTGRES_USER:-partnerguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-partnerguard-local}
      # Application role: not the schema owner (ADR-0015). Created by docker/postgres/init.
      APP_DB_USER: ${APP_DB_USER:-partnerguard_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-partnerguard-app-local}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d partnerguard"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
