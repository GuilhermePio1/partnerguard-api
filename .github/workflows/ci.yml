# Build and test on every push to main and every pull request.
# Milestone 7 adds contract lint, OWASP Dependency-Check, secret scanning and coverage.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege for the workflow token: the job only reads the repository.
permissions:
  contents: read

# A newer push to the same branch or PR cancels the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      # Actions are pinned to full commit SHAs, not tags, so a moved tag can't change what runs.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Generates code from contracts/openapi.yaml, compiles and runs every test.
      # Integration tests start PostgreSQL with Testcontainers on the runner's Docker.
      - name: Build and test
        run: ./mvnw -B -ntp verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7
