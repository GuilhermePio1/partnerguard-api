# Keeps the OWASP Dependency-Check vulnerability database (NIST's NVD data feeds, ADR-0025, plus
# the other built-in sources) in the Actions cache, so the dependency check in ci.yml (HRD-11)
# starts from it and only fetches the day's changes. This workflow is the only writer of that
# cache. Run it by hand to fill an empty cache.
name: NVD database

on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

# Least privilege for the workflow token: the job only reads the repository.
permissions:
  contents: read

# Its own group, never cancelled: a push to main must not stop a download halfway.
concurrency:
  group: nvd-database
  cancel-in-progress: false

# Actions are pinned to full commit SHAs, so a moved tag can't change what runs.
jobs:
  update:
    name: Update the vulnerability database
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compute the database cache key
        id: key
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      # Starts from the newest database, so a day's run only fetches what changed since then.
      - name: Restore the vulnerability database
        id: restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.dependency-check-data
          key: dependency-check-data-${{ steps.key.outputs.day }}
          restore-keys: dependency-check-data-

      # Fails on any download error. Dependency-Check records the feed dates only after every feed is
      # stored, and a failed step skips the save below, so a partial database is never cached.
      - name: Update the database
        run: ./mvnw -B -ntp dependency-check:update-only

      # Only after a successful update; a cache entry can't be replaced, so skip an exact hit.
      - name: Save the vulnerability database
        if: steps.restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.dependency-check-data
          key: dependency-check-data-${{ steps.key.outputs.day }}
